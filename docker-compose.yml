version: '3.8'

services:
  #Database: Persistente storage for all financial data
  db:
    image: postgres:15
    container_name: finance-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - finance-network
  #Ingestion Tool: No-code interface to manage database records

  nocodb:
    image: nocodb/nocodb:latest
    container_name: finance-ingestion
    restart: always
    environment:
      NC_DB: "pg://db:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=${POSTGRES_DB}"
    ports:
      - "8080:8080"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - finance-network
  # Visualization: Dashboards for financial monitoring
  grafana:
    image: grafana/grafana-oss:latest
    container_name: finance-dashboard
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - finance-network
  networks:
    finance-network:
      driver: bridge
